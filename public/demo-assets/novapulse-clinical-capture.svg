  <rect x="560" y="720" width="760" height="28" rx="14" fill="url(#npAccent)" />
  <text x="560" y="790" fill="#555148" font-family="Inter, sans-serif" font-size="18">Automated SBAR synthesis • Lab alert routing • Real-time bed turnover</text>
